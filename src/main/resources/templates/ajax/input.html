<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
	<h2>사용자 추가</h2>
	
		<label>이름</label><input type="text" id="nameInput"><br>
		<label>생년월일</label><input type="text" id="birthdayInput"><br>
		<label>이메일</label><input type="text" id="emailInput"> <button type="button" id="duplication"><br>
		<textarea rows="5" cols="50" id="introduceInput"></textarea><br>
		<button type="button" id="addBtn">추가</button>
		<script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
		<script>
			
		$("#duplication").on("click", function(){
			let email = $("#emailInput").val();
			
			if(email ==""){
				alert("이메일을 입력하세요");
				return;
			}
			
			$.ajax({
				type:"get"
				, url:"/ajax/user/duplicate-email"
				, data:{"email" : email}
				, success:function(response){
					if (response.isDuplicate){
						// 중복됨
						alert("중복된 이메일 입니다.");
					} else{
						// 중복안됨
						alert("사용가능한 이메일 입니다.");
					}
				}
				, error:function(){
					alert("중복확인 에러!")
				}
			});
			
		});
		
			$("#addBtn").on("click", function() {
				
			let name =	$("#nameInput").val();
			let birthday = $("#birthdayInput").val();
			let email = $("#emailInput").val();
			let introduce = $("#introduceInput").val();
			
			// 유효성 검사 (validation)
			if(name == ""){
				alert("이름을 입력하세요!");
				return;
			}
			if(birthday == ""){
				alert("생일을 입력하세요!");
				return;
			}
			if(email == ""){
				alert("이메일을 입력하세요!");
				return;
			}
			if(introduce == ""){
				alert("자기소개를 입력하세요!");
				return;
			}
			//alert(name + birthday + email + introduce);
			$.ajax({
				type:"post"
				, url:"/ajax/user/create"
				, data:{"name" :name, "birthday" : birthday, "email": email, "introduce":introduce}
				, success:function(response){
					// 성공 {"result": "success"}
					// 실패 {"result" : "fail"}
					if(response.result == "success"){
						alert("성공!!");
					} else{
						alert("사용자 추가 실패!");
					}
				}
			});
			
		});
		</script>
</body>
</html>
