<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Thymeleaf 변수와 조건문</title>
</head>
<body>
  <h2>Thymeleaf 변수와 조건문</h2>

  <h3>1. 변수</h3>
  <!-- with문으로 지역 변수 선언 -->
  <div th:with="number=100">
    <h4 th:text="${number}"></h4>
  </div>
  
  <!-- 이 부분은 지역변수를 벗어나므로 number는 사용 불가 -->
  <h4 th:text="'값 없음'"></h4>

  <h3>2. 태그 없이 thymeleaf 활용</h3>

  <!-- block 태그는 실제 렌더링되지 않음 -->
  <th:block th:with="number1=200, number2=300">
    <h4 th:text="${number1}"></h4>
    <h4 th:text="${number1 + number2}"></h4>
    <h4 th:text="'결과 : ' + (number1 + number2)"></h4>
    <h4 th:text="|결과 : ${number1 + number2}|"></h4>
  </th:block>

  <h3>3. 태그 나타내기</h3>
  <div th:text="'<b>진한글씨</b>'"></div> <!-- HTML 문자 그대로 출력 -->
  <div th:utext="'<b>진한글씨</b>'"></div> <!-- HTML 태그로 출력 -->


	
	<h3>4. 조건문</h3>
	<th:block th:with="age = 18">
		<!-- th:if 속서은 값이 true 일때 해당 태그가 포함(랜더링) 된다. -->
		<!--  15보다 크면 태그 보여주기 -->
		<h4 th:if="${age >= 15}">15살 이상입니다</h4>
		
		<h4 th:if="${age >= 20}">성인 입니다</h4>
		
		<!-- th:unless 속성은 값이 false 일때 태그가 포함(랜더링)된다 -->
		<h4 th:if="${age < 20}">미성년 입니다</h4>
		
	</th:block>
	<h3>5. switch문</h3>
	
	<th:block th:with="season = '봄'">
		<!--봄일때는 따뜻하다, 여름일때는 덥다, 가을일때는 시원하다, 겨울일때는 춥다  -->
		<div th:switch="${season}">
			<h4 th:case="봄">따뜻하다</h4>
			<h4 th:case="여름">덥다</h4>
			<h4 th:case="가을">시원하다</h4>
			<h4 th:case="겨울">춥다</h4>
		</div>
	</th:block>
	
</body>
</html>
	
	
	
	
	
	
	
	
	
	
	
</body>
</html>
